<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Access desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Access: desktop</text>
<text x="1374" y="32" class="label">Access: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="130" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">This immutable device</text>
<text x="280" y="199" class="body">Stacked name/role/expiry/connection; pair/forget separate local actions</text>
<rect x="264" y="288" width="1058" height="180" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="316" class="label">Effective permission model</text>
<text x="280" y="343" class="body">Token scope ∩ ready scope ∩ connected compatible agent ∩ capability; policy unknown unless disclosed</text>
<rect x="264" y="482" width="1058" height="225" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="510" class="label">Paired device list</text>
<text x="280" y="537" class="body">Search/role/refresh; metadata detail; revoke others with bound confirm</text>
<rect x="264" y="721" width="1058" height="80" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="749" class="label">Re-pair / active scope notes</text>
<text x="280" y="776" class="body">Files and Backups active; old grants do not acquire new scopes</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="180" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">This device</text>
<text x="1390" y="239" class="body">Readable stacked key/value metadata; no</text>
<text x="1390" y="260" class="body">per-character wrapping</text>
<rect x="1374" y="378" width="372" height="220" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="406" class="label">Effective access</text>
<text x="1390" y="433" class="body">Known intersection; actual denial/unknown</text>
<text x="1390" y="454" class="body">policy; no grant mutation</text>
<rect x="1374" y="612" width="372" height="230" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="640" class="label">Other paired devices</text>
<text x="1390" y="667" class="body">Search/role; details and bound revoke; no</text>
<text x="1390" y="688" class="body">self-revoke</text>
<rect x="1374" y="856" width="372" height="107" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="884" class="label">Re-pair note</text>
<text x="1390" y="911" class="body">Active Files/Backups; newly issued scopes</text>
<text x="1390" y="932" class="body">require re-pair</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>