<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Server desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Server: desktop</text>
<text x="1374" y="32" class="label">Server: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="140" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">Host service instrument</text>
<text x="280" y="199" class="body">Actual state/unit/PID when supplied; Paper connection separate</text>
<rect x="264" y="298" width="1058" height="115" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="326" class="label">Lifecycle operation strip</text>
<rect x="276" y="366" width="343.56" height="31" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="286" y="387.5" style="font-size:16px">Start (inactive/failed only)</text>
<rect x="627.56" y="366" width="333.22" height="31" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="637.56" y="387.5" style="font-size:16px">Graceful stop (active only)</text>
<rect x="968.78" y="366" width="333.22" height="31" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="978.78" y="387.5" style="font-size:16px">Restart (active only)</text>
<rect x="264" y="427" width="1058" height="140" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="455" class="label">Observed pending operation</text>
<text x="280" y="482" class="body">Requested / executing / waiting for Paper / signed result; not invented service history</text>
<rect x="264" y="581" width="1058" height="90" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="609" class="label">Runtime disclosure</text>
<text x="280" y="636" class="body">Supplied OS/arch/JVM/versions; scoped status refresh</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="165" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Host service state</text>
<text x="1390" y="239" class="body">Unknown remains unknown; supplied</text>
<text x="1390" y="260" class="body">unit/PID; Paper connection separate</text>
<rect x="1374" y="363" width="372" height="190" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="391" class="label">Lifecycle actions</text>
<text x="1390" y="418" class="body">44px targets; gated start/stop/restart;</text>
<text x="1390" y="439" class="body">bound effect confirmation</text>
<rect x="1374" y="567" width="372" height="170" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="595" class="label">Pending operation/result</text>
<text x="1390" y="622" class="body">Signed result, BUSY/error persists; no</text>
<text x="1390" y="643" class="body">inferred service timeline</text>
<rect x="1374" y="751" width="372" height="86" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="779" class="label">Runtime / refresh</text>
<text x="1390" y="806" class="body">Supplied details only</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>