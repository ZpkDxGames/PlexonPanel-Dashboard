<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Audit desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Audit: desktop</text>
<text x="1374" y="32" class="label">Audit: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="105" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">Query controls</text>
<text x="280" y="199" class="body">Paper/Host source; actor/action/outcome/date query; search loaded page</text>
<rect x="264" y="263" width="1058" height="315" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="291" class="label">Actual event timeline</text>
<text x="280" y="318" class="body">Supplied timestamp, actor, action, target, result; safe expanded detail</text>
<rect x="264" y="592" width="1058" height="105" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="620" class="label">Bounded table / pagination</text>
<text x="280" y="647" class="body">50 records; previous/next; request ID/agent-redacted JSON copy</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="140" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Audit query controls</text>
<text x="1390" y="239" class="body">Source and loaded-page search; filters</text>
<text x="1390" y="260" class="body">disclosure</text>
<rect x="1374" y="338" width="372" height="325" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="366" class="label">Event rows</text>
<text x="1390" y="393" class="body">Time/actor/action/target/result;</text>
<text x="1390" y="414" class="body">expandable safe details</text>
<rect x="1374" y="677" width="372" height="107" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="705" class="label">Pagination / table</text>
<text x="1390" y="732" class="body">50 rows; copy requestID/redactedJSON;</text>
<text x="1390" y="753" class="body">table alternative</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>