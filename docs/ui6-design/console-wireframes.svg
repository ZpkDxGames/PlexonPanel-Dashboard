<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Console desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Console: desktop</text>
<text x="1374" y="32" class="label">Console: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="75" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">Local toolbar</text>
<text x="280" y="199" class="body">Loaded-line search, level; Host source; filters and display disclosure</text>
<rect x="264" y="233" width="1058" height="360" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="261" class="label">Authoritative log well</text>
<text x="280" y="288" class="body">Host replay or signed live-only Paper fallback; invocation boundaries; copy</text>
<rect x="264" y="607" width="1058" height="130" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="635" class="label">Paper command composer</text>
<rect x="276" y="675" width="819.2" height="46" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="286" y="703" style="font-size:16px">Paper-only command input</text>
<rect x="1103.2" y="675" width="198.8" height="46" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="1113.2" y="703" style="font-size:16px">Bound review / Run</text>
<rect x="264" y="751" width="1058" height="65" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="779" class="label">Local read status</text>
<text x="280" y="806" class="body">Paused/new lines or capture source; load older retained Host history</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="107" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Console controls</text>
<text x="1390" y="239" class="body">Source consequence, search;</text>
<text x="1390" y="260" class="body">filters/display disclosure</text>
<rect x="1374" y="305" width="372" height="390" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="333" class="label">Log well</text>
<text x="1390" y="360" class="body">Timestamp column, plain text; intentional</text>
<text x="1390" y="381" class="body">horizontal code scroll; local pause</text>
<rect x="1374" y="709" width="372" height="115" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="737" class="label">Sticky Paper composer</text>
<text x="1390" y="764" class="body">IME-safe, safe-area inset; why</text>
<text x="1390" y="785" class="body">unavailable; bound confirmation</text>
<rect x="1374" y="838" width="372" height="86" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="866" class="label">Local status / older history</text>
<text x="1390" y="893" class="body">Unseen count and Host-scoped replay</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>