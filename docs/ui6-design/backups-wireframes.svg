<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Backups desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Backups: desktop</text>
<text x="1374" y="32" class="label">Backups: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="145" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">Readiness + backup initiation</text>
<rect x="276" y="212" width="560.7" height="61" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="286" y="240" style="font-size:16px">Known preflight checks and reasons</text>
<rect x="844.7" y="212" width="457.3" height="61" rx="3" fill="#e8ecea" stroke="#d3dad7"/>
<text x="854.7" y="240" style="font-size:16px">Fully Backup Now / choose countdown</text>
<rect x="264" y="303" width="1058" height="210" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="331" class="label">Durable current operation</text>
<text x="280" y="358" class="body">Real15 phase keys + outcomes; selected countdown; one progress/counter region</text>
<rect x="264" y="527" width="1058" height="140" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="555" class="label">Verification + retained backup rows</text>
<text x="280" y="582" class="body">Provider test time distinct from verified remote time; verify/retry/delete existing gates</text>
<rect x="264" y="681" width="1058" height="95" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="709" class="label">Restart schedule disclosure</text>
<text x="280" y="736" class="body">Daily/weekly/weekdays, countdown/timeouts; cannot create backup</text>
<rect x="264" y="790" width="1058" height="90" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="818" class="label">Destination / retention / safe failure</text>
<text x="280" y="845" class="body">Supplied destination; actual retention fields; safe diagnostic/runbook</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="210" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Backup readiness</text>
<text x="1390" y="239" class="body">Known checks plus unknown; Fully Backup</text>
<text x="1390" y="260" class="body">Now; countdown then bound confirm</text>
<rect x="1374" y="408" width="372" height="235" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="436" class="label">Durable operation</text>
<text x="1390" y="463" class="body">Real current phase and one progress</text>
<text x="1390" y="484" class="body">display; absent counters: not supplied</text>
<rect x="1374" y="657" width="372" height="180" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="685" class="label">Provider / backup rows</text>
<text x="1390" y="712" class="body">Distinct times; scoped verify/Retry</text>
<text x="1390" y="733" class="body">Upload/delete</text>
<rect x="1374" y="851" width="372" height="130" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="879" class="label">Scheduler and retention</text>
<text x="1390" y="906" class="body">Separate disclosures; bounded drafts</text>
<rect x="1374" y="995" width="372" height="100" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="1023" class="label">Destination / failure details</text>
<text x="1390" y="1050" class="body">No credentials; safe diagnostic</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>