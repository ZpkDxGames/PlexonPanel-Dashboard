<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Legacy archive desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Legacy archive: desktop</text>
<text x="1374" y="32" class="label">Legacy archive: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">PlexonPanel</text>
<text x="40" y="109" class="body">Global paired instances or public/legacy task; no lifecycle shortcut</text>
<rect x="24" y="144" width="1298" height="100" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Unverified local archive</text>
<text x="40" y="199" class="body">Back to Settings; old browser-only records; never Paper journal</text>
<rect x="24" y="258" width="1298" height="260" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="286" class="label">Local filters + old rows</text>
<text x="40" y="313" class="body">Stored server, player/UUID, event type and sort; bounded5000 old records</text>
<rect x="24" y="532" width="1298" height="100" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="560" class="label">Clear legacy archive</text>
<text x="40" y="587" class="body">Local-only native confirmation; no new writes, no server deletion</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Task header; return/navigation</text>
<rect x="1374" y="184" width="372" height="140" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Old local archive</text>
<text x="1390" y="239" class="body">Unverified; return to Settings</text>
<rect x="1374" y="338" width="372" height="300" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="366" class="label">Local filters / records</text>
<text x="1390" y="393" class="body">Stored server, player/UUID, type, sort; no</text>
<text x="1390" y="414" class="body">new collection</text>
<rect x="1374" y="652" width="372" height="120" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="680" class="label">Clear old archive</text>
<text x="1390" y="707" class="body">Native local confirmation; only this</text>
<text x="1390" y="728" class="body">browser old entries</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>