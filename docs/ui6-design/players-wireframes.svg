<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1280" viewBox="0 0 1770 1280" role="img" aria-labelledby="title desc">
<title id="title">Players desktop and mobile wireframes</title>
<desc id="desc">Documentation layout only. Labels refer to actual supplied data and existing controls. No example values or simulated production states.</desc>
<rect width="1770" height="1280" fill="#f3f5f4"/>
<style>text{font-family:Arial,sans-serif;fill:#1b2227}.label{font-size:20px;font-weight:600}.body{font-size:16px}.note{font-size:15px;fill:#4a5963}</style>
<text x="24" y="32" class="label">Players: desktop</text>
<text x="1374" y="32" class="label">Players: mobile</text>
<rect x="24" y="54" width="1298" height="72" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="82" class="label">Selected server and connection authority</text>
<text x="40" y="109" class="body">Relay / Paper / Host separately; compact observed Pulse; navigation palette</text>
<rect x="24" y="144" width="220" height="925" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="40" y="172" class="label">Navigation</text>
<text x="40" y="199" class="body">Fleet; Monitor;</text>
<text x="40" y="220" class="body">Operate; Manage. Local</text>
<text x="40" y="241" class="body">navigation only.</text>
<rect x="264" y="144" width="1058" height="75" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="172" class="label">Roster toolbar</text>
<text x="280" y="199" class="body">Search loaded players; world; sort; scoped snapshot refresh</text>
<rect x="264" y="233" width="1058" height="245" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="261" class="label">Live roster</text>
<text x="280" y="288" class="body">Name/head, supplied world/ping/session; whole row opens drawer</text>
<rect x="264" y="492" width="1058" height="120" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="520" class="label">Recent activity</text>
<text x="280" y="547" class="body">Real session join/leave; scoped Paper journal entry</text>
<rect x="264" y="626" width="1058" height="150" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="280" y="654" class="label">Player drawer</text>
<text x="280" y="681" class="body">Details | Actions | Moderation; all13 gates; bound dangerous action</text>
<rect x="1374" y="54" width="372" height="110" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="82" class="label">Menu / server / search</text>
<text x="1390" y="109" class="body">Authority text; palette; no bottom bar</text>
<rect x="1374" y="184" width="372" height="105" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="212" class="label">Roster controls</text>
<text x="1390" y="239" class="body">Search, world, sort and snapshot refresh</text>
<rect x="1374" y="303" width="372" height="260" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="331" class="label">Player rows</text>
<text x="1390" y="358" class="body">Whole44px target; supplied name, world,</text>
<text x="1390" y="379" class="body">ping, session; table preference survives</text>
<rect x="1374" y="577" width="372" height="150" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="605" class="label">Recent activity</text>
<text x="1390" y="632" class="body">Supplied observations; authorized retained</text>
<text x="1390" y="653" class="body">history</text>
<rect x="1374" y="741" width="372" height="250" rx="10" fill="#ffffff" stroke="#637883"/>
<text x="1390" y="769" class="label">Player detail sheet</text>
<text x="1390" y="796" class="body">Tabs, scope/supply-safe fields, all13</text>
<text x="1390" y="817" class="body">gated actions, bound confirm</text>
<text x="24" y="1238" class="note">Single content scroll; intentional table/log wells remain labelled. Desktop rail from1024px; tablet drawer; mobile targets44px.</text>
</svg>