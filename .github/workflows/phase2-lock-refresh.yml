name: Phase 2 lock refresh
on:
  push:
    branches: ["phase2/lock-refresh-3.2.0"]
permissions:
  contents: write
concurrency:
  group: phase2-lock-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Refresh lock and apply compatible audit fixes
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit generated lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh dependency lock after security upgrade"
            git push origin HEAD:phase2/lock-refresh-3.2.0
          fi
      - name: Require zero high/critical dependency findings
        run: npm audit --audit-level=high
