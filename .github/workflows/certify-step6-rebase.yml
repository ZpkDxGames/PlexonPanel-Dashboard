name: Certify Step 6 relay current-main integration

on:
  push:
    branches: [agent/step6-host-authorization-decoupling-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certify-step6-relay-rebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Apply validated Step 6 relay patch onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/step6-host-authorization-decoupling
          source_ref=origin/agent/step6-host-authorization-decoupling
          base_ref=$(git merge-base origin/main "$source_ref")
          paths=(
            docs/OPERATIONS.md
            docs/PROTOCOL.md
            relay/src/index-core.ts
            relay/src/standalone/room-manager-core.ts
            relay/tests/preflight-contract.test.mjs
            relay/tests/room.test.mjs
          )
          git diff --binary "$base_ref" "$source_ref" -- "${paths[@]}" > /tmp/step6-relay.patch
          test -s /tmp/step6-relay.patch
          git apply --3way /tmp/step6-relay.patch
          git diff --check
          git status --short

      - name: Validate dashboard and both relay runtimes
        run: |
          npm run check
          npm run relay:smoke
          npm run relay:standalone:smoke
          npm run relay:standalone:package
          npm run build

      - name: Commit certified Step 6 relay integration
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            docs/OPERATIONS.md
            docs/PROTOCOL.md
            relay/src/index-core.ts
            relay/src/standalone/room-manager-core.ts
            relay/tests/preflight-contract.test.mjs
            relay/tests/room.test.mjs
          )
          git add -- "${paths[@]}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror Paper authorization state to Host"
          git push origin HEAD:agent/step6-host-authorization-decoupling-final
