name: Dashboard and relay checks
on:
  push:
    branches: [main, "agent/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run relay:smoke
      - run: npm run relay:standalone:smoke
      - run: npm run relay:standalone:package
      - run: npm run build
      - name: Package coordinated Dashboard and relay evidence
        env:
          PLEXON_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run release:manifest
      - uses: actions/upload-artifact@v7
        with:
          name: PlexonPanel-Dashboard-4.0.0
          path: artifacts/plexonpanel-relay/
          if-no-files-found: error
          retention-days: 14
