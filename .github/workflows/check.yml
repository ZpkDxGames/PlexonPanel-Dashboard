name: Dashboard and relay checks
on:
  push:
    branches: [main, "agent/**", "phase2/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run phase2:verify
      - uses: actions/upload-artifact@v7
        with:
          name: PlexonPanel-Dashboard-3.2.0-rc.1
          path: artifacts/plexonpanel-relay/
          if-no-files-found: error
          retention-days: 14
