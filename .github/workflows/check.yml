name: Dashboard and relay checks
on:
  push:
    branches: [main, "agent/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Apply one-shot 3.4 relay reconciliation
        if: github.event_name == 'pull_request' && github.head_ref == 'release/3.4.0-host-console'
        run: |
          node scripts/apply-3-4-relay.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/src/index.ts relay/src/standalone/room-manager.ts package.json package-lock.json .github/workflows/check.yml
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Implement host-authoritative console relay 3.4"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run relay:smoke
      - run: npm run relay:standalone:smoke
      - run: npm run relay:standalone:package
      - run: npm run build
