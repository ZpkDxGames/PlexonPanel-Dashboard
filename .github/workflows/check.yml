name: Dashboard and relay checks
on:
  push:
    branches: [main, "agent/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run relay:smoke
      - run: npm run relay:standalone:smoke
      - run: npm run relay:standalone:package
      - run: npm run build
      - name: Install native verification browser
        run: npx playwright install --with-deps chromium
      - name: Verify native workspace layouts and accessibility
        env:
          PLEXON_UI_SOAK_MS: "10000"
          PLEXON_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PlexonPanel-UI-Evidence
          path: docs/ui-evidence/after/
          if-no-files-found: warn
          retention-days: 14
      - id: version
        run: node -e 'const fs=require("node:fs");fs.appendFileSync(process.env.GITHUB_OUTPUT,"value="+require("./package.json").version+"\n")'
      - name: Package coordinated Dashboard and relay evidence
        env:
          PLEXON_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run release:manifest
      - uses: actions/upload-artifact@v7
        with:
          name: PlexonPanel-Dashboard-${{ steps.version.outputs.value }}
          path: artifacts/plexonpanel-relay/
          if-no-files-found: error
          retention-days: 14
