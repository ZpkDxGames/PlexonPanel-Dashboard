name: Verify dashboard
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:purge && npm run typecheck && npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:production
        env:
          EVIDENCE_DIR: artifacts/mission-deck
      - run: npm run verify:structure
        env:
          EVIDENCE_DIR: artifacts/mission-deck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-deck-browser-evidence
          path: artifacts/mission-deck/
