name: Verify dashboard
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install purge-check dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm run verify:purge && npm run typecheck && npm run lint && npm test && npm run build
      - name: Verify standalone Protocol 3 relay
        run: npm run relay:test && npm run relay:standalone:smoke && npm run relay:standalone:package
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:production
        env:
          EVIDENCE_DIR: artifacts/mission-deck
      - run: npm run verify:structure
        env:
          EVIDENCE_DIR: artifacts/mission-deck
      - name: Verify mixed Java and Bedrock fleet in Chromium
        run: node scripts/bedrock-qa.mjs
        env:
          EVIDENCE_DIR: artifacts/mission-deck/bedrock
      - uses: actions/upload-artifact@v4
        with:
          name: plexonpanel-standalone-relay
          path: artifacts/plexonpanel-relay/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-deck-browser-evidence
          path: artifacts/mission-deck/
