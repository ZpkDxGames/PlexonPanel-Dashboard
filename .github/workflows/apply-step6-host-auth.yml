name: Apply Step 6 host authorization relay

on:
  push:
    branches: [agent/step6-host-authorization-decoupling]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step6-host-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Apply Step 6 source transformation
        run: node scripts/apply-step6-host-auth.mjs
      - name: Validate dashboard and both relay runtimes
        run: |
          npm run check
          npm run relay:smoke
          npm run relay:standalone:smoke
          npm run relay:standalone:package
          npm run build
      - name: Commit validated transformation
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply-step6-host-auth.mjs .github/workflows/apply-step6-host-auth.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror Paper authorization state to Host"
          git push origin HEAD:agent/step6-host-authorization-decoupling
