name: Apply 3.4.1 backup recovery patch

on:
  push:
    branches:
      - agent/3.4.1-backup-recovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[backup-recovery-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after, label):
              p = Path(path)
              text = p.read_text()
              if after in text:
                  print(f"{label}: already applied")
                  return
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(before, after))
              print(f"{label}: applied")

          def append_once(path, marker, content, label):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  print(f"{label}: already applied")
                  return
              p.write_text(text.rstrip() + "\n\n" + content.strip() + "\n")
              print(f"{label}: applied")

          replace_once(
              "app/dashboard-2-1.tsx",
              'import { BackupsView30 } from "./backups-view-3-0";',
              'import { BackupsView30 } from "./backups-view-3-4-1";',
              "wire 3.4.1 backup view",
          )

          replace_once(
              "app/control-views.tsx",
              '''  const [data, setData] = useState<JsonMap>({}),
            [error, setError] = useState(""),
            [busy, setBusy] = useState(false),
            [revision, setRevision] = useState(0);'''.replace("          ", "  "),
              '''  const [data, setData] = useState<JsonMap>({}),
    [error, setError] = useState(""),
    [busy, setBusy] = useState(false),
    [hasSuccess, setHasSuccess] = useState(false),
    [updatedAt, setUpdatedAt] = useState(0),
    [revision, setRevision] = useState(0);''',
              "query success metadata state",
          )
          replace_once(
              "app/control-views.tsx",
              '''      .then((result) => {
        if (current) setData(result.data);
      })''',
              '''      .then((result) => {
        if (current) {
          setData(result.data);
          setHasSuccess(true);
          setUpdatedAt(Date.now());
        }
      })''',
              "query success metadata update",
          )
          replace_once(
              "app/control-views.tsx",
              '''  return {
    data,
    error,
    busy,
    refresh: useCallback(() => setRevision((r) => r + 1), []),
  };''',
              '''  return {
    data,
    error,
    busy,
    hasSuccess,
    updatedAt,
    refresh: useCallback(() => setRevision((r) => r + 1), []),
  };''',
              "query success metadata return",
          )

          replace_once(
              "lib/data-source.ts",
              '''        String(result.code ?? "FAILED"),
        String(result.status ?? "DENIED"),
      ),''',
              '''        String(result.code ?? "FAILED"),
        String(result.status ?? "DENIED"),
        requestId,
        typeof result.action === "string" ? result.action : "",
        result.data !== null &&
        typeof result.data === "object" &&
        !Array.isArray(result.data)
          ? (result.data as Record<string, unknown>)
          : {},
      ),''',
              "structured action error construction",
          )
          replace_once(
              "lib/data-source.ts",
              '''export class ActionError extends Error {
  constructor(
    message: string,
    readonly code: string,
    readonly status: string,
  ) {
    super(message);
  }
}''',
              '''export class ActionError extends Error {
  constructor(
    message: string,
    readonly code: string,
    readonly status: string,
    readonly requestId = "",
    readonly action = "",
    readonly data: Record<string, unknown> = {},
  ) {
    super(message);
  }
}''',
              "structured action error contract",
          )

          relay_failure = '''if (!(await this.sendToAgent("PAPER", "backup.coordination", body))) {
        await this.sendToAgent("HOST", "backup.coordination.result", {
          requestId: body.requestId,
          success: false,
          code: "PAPER_COORDINATION_UNAVAILABLE",
          phase: "COORDINATING_PAPER",
          message: "The relay could not deliver save coordination to an authenticated Paper agent.",
        });
      }'''
          replace_once(
              "relay/src/index-core.ts",
              'await this.sendToAgent("PAPER", "backup.coordination", body);',
              relay_failure,
              "worker immediate backup coordination failure",
          )
          replace_once(
              "relay/src/standalone/room-manager-core.ts",
              'await this.sendToAgent("PAPER", "backup.coordination", body);',
              relay_failure,
              "standalone immediate backup coordination failure",
          )

          replace_once(
              "relay/tests/room.test.mjs",
              '''  assert.equal(host.socket.closed, null);
  assert.equal(host.socket.attachment.authenticated, true);
  assert.equal(paper.socket.closed.code, 1011);
});''',
              '''  assert.equal(host.socket.closed, null);
  assert.equal(host.socket.attachment.authenticated, true);
  assert.equal(paper.socket.closed.code, 1011);
  const failureEnvelope = host.socket.sent.find(
    (message) => message.type === "backup.coordination.result",
  );
  assert.ok(failureEnvelope, "Host receives an immediate coordination result");
  const failure = decodeEnvelope(JSON.stringify(failureEnvelope)).body;
  assert.equal(failure.success, false);
  assert.equal(failure.code, "PAPER_COORDINATION_UNAVAILABLE");
  assert.equal(failure.phase, "COORDINATING_PAPER");
});''',
              "worker failed Paper routing regression",
          )

          replace_once(
              "package.json",
              '"version": "3.4.0"',
              '"version": "3.4.1"',
              "dashboard package version",
          )
          replace_once(
              "lib/dashboard-version.ts",
              'export const DASHBOARD_VERSION = "3.4.0" as const;',
              'export const DASHBOARD_VERSION = "3.4.1" as const;',
              "dashboard visible version",
          )

          append_once(
              "app/backups-scaffold.css",
              "/* Dashboard 3.4.1 — backup readiness diagnostics. */",
              r'''
          /* Dashboard 3.4.1 — backup readiness diagnostics. */
          .cr341-readiness-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
            gap: 10px;
            padding: 16px;
          }

          .cr341-readiness-item {
            min-width: 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--cr31-divider, var(--cr21-border-soft));
            border-radius: var(--cr31-card-radius, 15px);
            background: var(--cr31-surface-card, var(--cr21-surface-1));
          }

          .cr341-readiness-item > div {
            min-width: 0;
            display: grid;
            gap: 4px;
          }

          .cr341-readiness-item strong {
            font-size: .78rem;
          }

          .cr341-readiness-item small {
            color: var(--cr21-text-muted);
            font-size: .7rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
          }

          .cr341-phase-list {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
            padding: 16px;
          }

          .cr341-phase {
            min-width: 0;
            display: grid;
            justify-items: center;
            gap: 6px;
            padding: 10px 6px;
            border: 1px solid var(--cr31-divider, var(--cr21-border-soft));
            border-radius: 12px;
            color: var(--cr21-text-muted);
            text-align: center;
          }

          .cr341-phase strong {
            font-size: .63rem;
            font-weight: 750;
            letter-spacing: .045em;
            overflow-wrap: anywhere;
          }

          .cr341-phase.done,
          .cr341-phase.active {
            color: var(--cr21-text-primary);
            background: var(--cr31-surface-card, var(--cr21-surface-1));
          }

          @container workspace (max-width: 820px) {
            .cr341-phase-list {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @container workspace (max-width: 480px) {
            .cr341-readiness-grid,
            .cr341-phase-list {
              grid-template-columns: 1fr;
            }
          }
          ''',
              "3.4.1 backup readiness styles",
          )
          PY
      - name: Add relay parity regression
        shell: bash
        run: |
          cat > relay/tests/backup-coordination-parity.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import test from "node:test";

          const root = resolve(import.meta.dirname, "../..");
          const text = (path) => readFile(resolve(root, path), "utf8");

          for (const [label, sourcePath, distPath] of [
            ["Worker", "relay/src/index-core.ts", "relay/dist/index-core.js"],
            [
              "standalone",
              "relay/src/standalone/room-manager-core.ts",
              "relay/dist/standalone/room-manager-core.js",
            ],
          ]) {
            test(`${label} relay returns a structured failure when Paper coordination cannot be delivered`, async () => {
              for (const candidate of [await text(sourcePath), await text(distPath)]) {
                assert.match(candidate, /PAPER_COORDINATION_UNAVAILABLE/);
                assert.match(candidate, /COORDINATING_PAPER/);
                assert.match(candidate, /backup\.coordination\.result/);
              }
            });
          }
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Verify patched dashboard and relay
        run: |
          npm run check
          npm run relay:smoke
          npm run relay:standalone:smoke
          npm run relay:standalone:package
          npm run build
      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-backup-recovery-3.4.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete 3.4.1 backup recovery control plane [backup-recovery-applied]"
          git push origin HEAD:agent/3.4.1-backup-recovery
