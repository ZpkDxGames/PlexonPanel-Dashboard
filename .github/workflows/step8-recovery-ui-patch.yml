name: Step 8 recovery UI patch

on:
  push:
    branches:
      - agent/step8-recovery-resolution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step8-recovery-resolution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply recovery UI patch
        run: |
          node scripts/step8-recovery-ui-patch.mjs
          npm run scopes:generate

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/backups-view-3-4-1.tsx \
            protocol/action-scopes.json \
            lib/scopes.ts \
            relay/src/scopes.ts \
            tests/backups-maintenance.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[step8-recovery-ui-applied] Add safe recovery resolution control"
          git push origin HEAD:agent/step8-recovery-resolution
