name: Apply 341 source patch

on:
  push:
    branches:
      - agent/3.4.1-backup-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.4.1-backup-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def swap(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(label + ': already applied')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new))
              print(label + ': applied')

          swap('app/dashboard-2-1.tsx',
               'import { BackupsView30 } from "./backups-view-3-0";',
               'import { BackupsView30 } from "./backups-view-3-4-1";',
               'backup view routing')

          swap('app/control-views.tsx',
               '''  const [data, setData] = useState<JsonMap>({}),
    [error, setError] = useState(""),
    [busy, setBusy] = useState(false),
    [revision, setRevision] = useState(0);''',
               '''  const [data, setData] = useState<JsonMap>({}),
    [error, setError] = useState(""),
    [busy, setBusy] = useState(false),
    [hasSuccess, setHasSuccess] = useState(false),
    [updatedAt, setUpdatedAt] = useState(0),
    [revision, setRevision] = useState(0);''',
               'query state metadata')
          swap('app/control-views.tsx',
               '''      .then((result) => {
        if (current) setData(result.data);
      })''',
               '''      .then((result) => {
        if (current) {
          setData(result.data);
          setHasSuccess(true);
          setUpdatedAt(Date.now());
        }
      })''',
               'query success metadata')
          swap('app/control-views.tsx',
               '''  return {
    data,
    error,
    busy,
    refresh: useCallback(() => setRevision((r) => r + 1), []),
  };''',
               '''  return {
    data,
    error,
    busy,
    hasSuccess,
    updatedAt,
    refresh: useCallback(() => setRevision((r) => r + 1), []),
  };''',
               'query return metadata')

          swap('lib/data-source.ts',
               '''        String(result.code ?? "FAILED"),
        String(result.status ?? "DENIED"),
      ),''',
               '''        String(result.code ?? "FAILED"),
        String(result.status ?? "DENIED"),
        requestId,
        typeof result.action === "string" ? result.action : "",
        result.data !== null &&
        typeof result.data === "object" &&
        !Array.isArray(result.data)
          ? (result.data as Record<string, unknown>)
          : {},
      ),''',
               'action error construction')
          swap('lib/data-source.ts',
               '''export class ActionError extends Error {
  constructor(
    message: string,
    readonly code: string,
    readonly status: string,
  ) {
    super(message);
  }
}''',
               '''export class ActionError extends Error {
  constructor(
    message: string,
    readonly code: string,
    readonly status: string,
    readonly requestId = "",
    readonly action = "",
    readonly data: Record<string, unknown> = {},
  ) {
    super(message);
  }
}''',
               'action error metadata')

          failure = '''if (!(await this.sendToAgent("PAPER", "backup.coordination", body))) {
        await this.sendToAgent("HOST", "backup.coordination.result", {
          requestId: body.requestId,
          success: false,
          code: "PAPER_COORDINATION_UNAVAILABLE",
          phase: "COORDINATING_PAPER",
          message: "The relay could not deliver save coordination to an authenticated Paper agent.",
        });
      }'''
          swap('relay/src/index-core.ts',
               'await this.sendToAgent("PAPER", "backup.coordination", body);',
               failure,
               'worker coordination failure')
          swap('relay/src/standalone/room-manager-core.ts',
               'await this.sendToAgent("PAPER", "backup.coordination", body);',
               failure,
               'standalone coordination failure')

          swap('relay/tests/room.test.mjs',
               '''  assert.equal(host.socket.closed, null);
  assert.equal(host.socket.attachment.authenticated, true);
  assert.equal(paper.socket.closed.code, 1011);
});''',
               '''  assert.equal(host.socket.closed, null);
  assert.equal(host.socket.attachment.authenticated, true);
  assert.equal(paper.socket.closed.code, 1011);
  const failureEnvelope = host.socket.sent.find(
    (message) => message.type === "backup.coordination.result",
  );
  assert.ok(failureEnvelope, "Host receives an immediate coordination result");
  const failure = decodeEnvelope(JSON.stringify(failureEnvelope)).body;
  assert.equal(failure.success, false);
  assert.equal(failure.code, "PAPER_COORDINATION_UNAVAILABLE");
  assert.equal(failure.phase, "COORDINATING_PAPER");
});''',
               'worker coordination regression')

          swap('app/backups-view-3-4-1.tsx',
               '''  const allBackups = useMemo<BackupRow[]>(
    () =>
      [
        ...fullBackups.map(
          (backup): BackupRow => ({ ...backup, _kind: "full" }),
        ),
        ...liveBackups.map(
          (backup): BackupRow => ({ ...backup, _kind: "live" }),
        ),
      ].sort(
        (a, b) =>
          Date.parse(str(b.timestamp, "1970-01-01")) -
          Date.parse(str(a.timestamp, "1970-01-01")),
      ),
    [fullBackups, liveBackups],
  );''',
               '''  const allBackups: BackupRow[] = [
    ...fullBackups.map(
      (backup): BackupRow => ({ ...backup, _kind: "full" }),
    ),
    ...liveBackups.map(
      (backup): BackupRow => ({ ...backup, _kind: "live" }),
    ),
  ].sort(
    (a, b) =>
      Date.parse(str(b.timestamp, "1970-01-01")) -
      Date.parse(str(a.timestamp, "1970-01-01")),
  );''',
               'unconditional backup inventory calculation')

          swap('package.json', '"version": "3.4.0"', '"version": "3.4.1"', 'package version')
          swap('lib/dashboard-version.ts',
               'export const DASHBOARD_VERSION = "3.4.0" as const;',
               'export const DASHBOARD_VERSION = "3.4.1" as const;',
               'dashboard version')

          css = Path('app/backups-scaffold.css')
          css_text = css.read_text()
          marker = '/* Dashboard 3.4.1 — backup readiness diagnostics. */'
          if marker not in css_text:
              css.write_text(css_text.rstrip() + '''\n\n/* Dashboard 3.4.1 — backup readiness diagnostics. */
.cr341-readiness-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
  gap: 10px;
  padding: 16px;
}
.cr341-readiness-item {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--cr31-divider, var(--cr21-border-soft));
  border-radius: var(--cr31-card-radius, 15px);
  background: var(--cr31-surface-card, var(--cr21-surface-1));
}
.cr341-readiness-item > div { min-width: 0; display: grid; gap: 4px; }
.cr341-readiness-item strong { font-size: .78rem; }
.cr341-readiness-item small {
  color: var(--cr21-text-muted);
  font-size: .7rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.cr341-phase-list {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
  padding: 16px;
}
.cr341-phase {
  min-width: 0;
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 10px 6px;
  border: 1px solid var(--cr31-divider, var(--cr21-border-soft));
  border-radius: 12px;
  color: var(--cr21-text-muted);
  text-align: center;
}
.cr341-phase strong {
  font-size: .63rem;
  font-weight: 750;
  letter-spacing: .045em;
  overflow-wrap: anywhere;
}
.cr341-phase.done,
.cr341-phase.active {
  color: var(--cr21-text-primary);
  background: var(--cr31-surface-card, var(--cr21-surface-1));
}
@container workspace (max-width: 820px) {
  .cr341-phase-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container workspace (max-width: 480px) {
  .cr341-readiness-grid,
  .cr341-phase-list { grid-template-columns: 1fr; }
}
''')
          PY
      - name: Add parity test
        shell: bash
        run: |
          cat > relay/tests/backup-coordination-parity.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import test from "node:test";

          const root = resolve(import.meta.dirname, "../..");
          const text = (path) => readFile(resolve(root, path), "utf8");

          for (const [label, sourcePath, distPath] of [
            ["Worker", "relay/src/index-core.ts", "relay/dist/index-core.js"],
            ["standalone", "relay/src/standalone/room-manager-core.ts", "relay/dist/standalone/room-manager-core.js"],
          ]) {
            test(`${label} relay immediately reports failed Paper backup coordination`, async () => {
              for (const candidate of [await text(sourcePath), await text(distPath)]) {
                assert.match(candidate, /PAPER_COORDINATION_UNAVAILABLE/);
                assert.match(candidate, /COORDINATING_PAPER/);
                assert.match(candidate, /backup\.coordination\.result/);
              }
            });
          }
          EOF
      - run: npm ci
      - name: Verify
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run check
          npm run relay:smoke
          npm run relay:standalone:smoke
          npm run relay:standalone:package
          npm run build
      - name: Commit verified source
        shell: bash
        run: |
          rm .github/workflows/apply-341-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete 3.4.1 backup recovery control plane"
          git push origin HEAD:agent/3.4.1-backup-recovery
