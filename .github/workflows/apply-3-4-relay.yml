name: Apply PlexonPanel 3.4 relay reconciliation

on:
  push:
    branches: ["release/3.4.0-host-console"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/3.4.0-host-console
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/apply-3-4-relay.mjs
      - name: Commit reconciled sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/src/index.ts relay/src/standalone/room-manager.ts package.json package-lock.json .github/workflows/check.yml
          git diff --cached --check
          git commit -m "Implement host-authoritative console relay 3.4"
          git push origin HEAD:release/3.4.0-host-console
