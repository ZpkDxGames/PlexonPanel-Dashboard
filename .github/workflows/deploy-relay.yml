name: Deploy production relay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plexonpanel-production-relay
  cancel-in-progress: false

jobs:
  coordination:
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: gate
        run: node scripts/coordinated-deployment.mjs --github-output

  deploy-relay:
    needs: coordination
    if: github.ref == 'refs/heads/main' && needs.coordination.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_RELAY_URL: ${{ vars.PRODUCTION_RELAY_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify accepted source
        run: |
          npm run check
          npm run relay:smoke
          npm run relay:standalone:smoke
      - name: Require production deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          case "$PRODUCTION_RELAY_URL" in
            https://*) ;;
            *) echo "::error::PRODUCTION_RELAY_URL must be a configured HTTPS repository variable"; exit 1 ;;
          esac
      - name: Stamp accepted revision
        env:
          PLEXON_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: node scripts/stamp-relay-deployment.mjs
      - name: Deploy Cloudflare relay
        run: npx wrangler deploy --config relay/wrangler.production.jsonc
      - name: Verify deployed relay identity
        shell: bash
        run: |
          health_file=/tmp/plexonpanel-relay-health.json
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --retry 2 --retry-delay 1 \
              --header "Cache-Control: no-cache" \
              "$PRODUCTION_RELAY_URL/healthz?revision=$GITHUB_SHA&attempt=$attempt" \
              > "$health_file" &&
              jq -e --arg sha "$GITHUB_SHA" '
                .ok == true and
                .protocolVersion == 3 and
                .runtimeKind == "cloudflare-worker" and
                .gitCommit == $sha
              ' "$health_file" >/dev/null; then
              echo "Production relay reports accepted revision ${GITHUB_SHA:0:12}."
              exit 0
            fi

            echo "Relay identity has not converged (attempt $attempt/15)."
            sleep 2
          done

          echo "::error::Production relay did not report accepted revision ${GITHUB_SHA:0:12}."
          jq '{ok, protocolVersion, runtimeKind, gitCommit, buildTimestamp}' \
            "$health_file" 2>/dev/null || echo "Relay health response was not valid JSON."
          exit 1
