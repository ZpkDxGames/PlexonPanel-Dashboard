name: Temporary dependency audit 341

on:
  push:
    branches:
      - agent/3.4.1-backup-recovery

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact audit report
        run: npm audit --json || true
