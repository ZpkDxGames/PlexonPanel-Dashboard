name: Apply 3.0.2 reliability source changes v2
on:
  push:
    branches:
      - agent/3.0.2-reliability
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/3.0.2-reliability
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Apply changes and verify
        run: |
          python3 scripts/fix-3.0.2-patcher.py
          python3 scripts/apply-3.0.2-reliability.py
          python3 scripts/fix-3.0.2-tests.py
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
      - name: Commit source changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/src/index.ts relay/tests/room.test.mjs relay/tests/worker.test.mjs tests/dashboard-2-1.test.mjs package.json package-lock.json lib/control-state.ts docs/PROTOCOL.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden 3.0.2 relay lifecycle"
          git push origin HEAD:agent/3.0.2-reliability
