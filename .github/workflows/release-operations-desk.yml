name: Verify v5 Workbench
on:
  pull_request:
  push:
    branches: [main, work/v5-full-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_PLEXON_RELAY_URL: https://tonimserver.ddns.net
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:interactions
      - run: npm run test:perf
        env:
          NEXT_PUBLIC_PLEXON_RELAY_URL: https://tonimserver.ddns.net
