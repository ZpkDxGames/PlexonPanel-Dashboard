name: Dashboard CI

on:
  pull_request:
    branches:
      - main
      - "revamp/**"
  push:
    branches:
      - main
      - "fix/**"
      - "revamp/**"

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive release browser gate
        run: npm run test:release65

      - name: Stabilization source clocks, uptime and responsive gates
        run: npm run test:stabilization

      - name: Existing interaction, accessibility and refinement gates
        run: |
          npm run test:perf
          npm run test:revamp
          npm run test:visual -- --out=artifacts/visual
          npm run test:refinement

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-browser-evidence
          path: |
            artifacts/
            docs/revamp/6.5.0/refinement-interactions.json
            docs/revamp/6.5.0/retained-interactions.json
            docs/revamp/6.5.0/console-history-fixed.png
            docs/revamp/6.5.0/lifecycle-confirm-fixed.png
