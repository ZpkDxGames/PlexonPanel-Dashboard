name: Dashboard CI

on:
  pull_request:
    branches:
      - main
      - "revamp/**"
  push:
    branches:
      - main
      - "fix/**"
      - "revamp/**"

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive release browser gate
        run: npm run test:release65

      - name: Stabilization source clocks, uptime and responsive gates
        run: npm run test:stabilization

      - name: General browser gate
        run: |
          npm run dev > /tmp/plexon-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for attempt in {1..50}; do curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          npm run test:browser

      - name: Bundle performance budget
        if: ${{ !cancelled() }}
        run: npm run test:perf

      - name: Retained interaction gates
        if: ${{ !cancelled() }}
        run: npm run test:revamp

      - name: Visual accessibility gates
        if: ${{ !cancelled() }}
        run: npm run test:visual -- --out=artifacts/visual

      - name: Refinement gates
        if: ${{ !cancelled() }}
        run: npm run test:refinement

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-browser-evidence
          path: |
            artifacts/
            docs/revamp/6.5.0/refinement-interactions.json
            docs/revamp/6.5.0/retained-interactions.json
            docs/revamp/6.5.0/console-history-fixed.png
            docs/revamp/6.5.0/lifecycle-confirm-fixed.png
